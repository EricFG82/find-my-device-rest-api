services:
  google-findmy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-findmy-api
    ports:
      - "8000:8000"
    volumes:
      # Mount only the secrets.json file (not the entire Auth directory to preserve Python modules)
      - ./auth_data/secretes.json:/app/GoogleFindMyTools/Auth/secrets.json
      # Optional: Mount app code for development
      # - ./app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # Optional: Set to 'false' to disable background location updates (e.g., to reduce network usage)
      # Location updates now work in all environments including Synology NAS
      - ENABLE_LOCATION_UPDATES=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - findmy-network

networks:
  findmy-network:
    driver: bridge

