services:
  google-findmy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-findmy-api
    ports:
      - "8000:8000"
    volumes:
      # Mount only the secrets.json file (not the entire Auth directory to preserve Python modules)
      - ./auth_data/secrets.json:/app/GoogleFindMyTools/Auth/secrets.json
      # Optional: Mount app code for development
      # - ./app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG

      # Device Service Configuration
      # Cache TTL for device list in seconds (default: 60)
      - DEVICE_CACHE_TTL=60

      # Location update interval in seconds (default: 300 = 5 minutes)
      # Lower values = more frequent updates but more API calls
      # Recommended: 180-600 seconds (3-10 minutes)
      - LOCATION_UPDATE_INTERVAL=300

      # Enable/disable background location updates (default: true)
      # Set to 'false' to disable automatic location updates
      - ENABLE_LOCATION_UPDATES=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - findmy-network

networks:
  findmy-network:
    driver: bridge

