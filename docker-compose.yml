services:
  google-findmy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-findmy-api
    ports:
      - "8000:8000"
    volumes:
      # Mount only the secrets file to persist authentication (not the entire Auth directory)
      - ./auth_data:/app/auth_data
      # Optional: Mount app code for development
      # - ./app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - findmy-network

networks:
  findmy-network:
    driver: bridge

